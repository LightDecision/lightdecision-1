<svg xmlns="http://www.w3.org/2000/svg" width="800" height="306" viewBox="0 0 800 306" role="img" aria-labelledby="title description">
  <title id="title">LightDecision-1 Highlights</title>
  <desc id="description">Open-vocabulary decisions, multimodal inputs, probabilistic outputs, and non-autoregressive inference.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .card { fill: #fdfefe; stroke: #dce3ec; }
    .heading { fill: #172b42; font-size: 23px; font-weight: 700; letter-spacing: -.4px; }
    .body { fill: #4e6074; font-size: 19px; }
    .badge { fill: var(--tint); }
    .icon { fill: none; stroke: var(--ink); stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .blue { --tint: #eaf3fd; --ink: #286bab; }
    .teal { --tint: #e6f5ef; --ink: #167564; }
    .violet { --tint: #f1ebfa; --ink: #7450a3; }
    .amber { --tint: #fff3dc; --ink: #8b5c13; }

    @media (prefers-color-scheme: dark) {
      .card { fill: #161e2a; stroke: #34455b; }
      .heading { fill: #f0f5fb; }
      .body { fill: #b8c7d9; }
      .blue { --tint: #1c3551; --ink: #92caff; }
      .teal { --tint: #173a36; --ink: #87d8c4; }
      .violet { --tint: #302644; --ink: #cdb4fa; }
      .amber { --tint: #40311c; --ink: #f3c977; }
    }
  </style>

  <g class="blue">
    <rect class="card" x=".5" y=".5" width="391" height="144" rx="16" />
    <rect class="badge" x="22" y="18" width="42" height="42" rx="11" />
    <g class="icon" transform="translate(31 27)">
      <circle cx="12" cy="12" r="9" />
      <circle cx="12" cy="12" r="5" />
      <circle cx="12" cy="12" r="1" />
    </g>
    <text class="heading" x="22" y="92">Open-Vocabulary Decisions</text>
    <text class="body" x="22" y="120">Define candidates in natural language.</text>
  </g>

  <g class="teal" transform="translate(408 0)">
    <rect class="card" x=".5" y=".5" width="391" height="144" rx="16" />
    <rect class="badge" x="22" y="18" width="42" height="42" rx="11" />
    <g class="icon" transform="translate(31 27)">
      <rect x="3" y="3" width="18" height="18" rx="3" />
      <circle cx="8" cy="8" r="1.5" />
      <path d="m3 17 5-5 4 4 4-5 5 6" />
    </g>
    <text class="heading" x="22" y="92">Multimodal Inputs</text>
    <text class="body" x="22" y="120">Use text and images in a request.</text>
  </g>

  <g class="violet" transform="translate(0 161)">
    <rect class="card" x=".5" y=".5" width="391" height="144" rx="16" />
    <rect class="badge" x="22" y="18" width="42" height="42" rx="11" />
    <path class="icon" transform="translate(31 27)" d="M3 4v16h18M8 16v-4m5 4V7m5 9v-6" />
    <text class="heading" x="22" y="92">Probabilistic Outputs</text>
    <text class="body" x="22" y="120">Get a probability for each candidate.</text>
  </g>

  <g class="amber" transform="translate(408 161)">
    <rect class="card" x=".5" y=".5" width="391" height="144" rx="16" />
    <rect class="badge" x="22" y="18" width="42" height="42" rx="11" />
    <path class="icon" transform="translate(31 27)" d="m13 2-9 12h7l-1 8 10-12h-8z" />
    <text class="heading" x="22" y="92">Non-Autoregressive Inference</text>
    <text class="body" x="22" y="120">Score choices with zero output tokens.</text>
  </g>
</svg>
