[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightdecision"
version = "1.0.0"
description = "Text and vision inference for LightDecision-1 decision models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3",
  "transformers==5.12.1",
  "huggingface-hub>=1,<2",
  "safetensors>=0.5",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
cuda = ["fla-core==0.5.2"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lightdecision = "lightdecision.cli:main"

[project.urls]
Repository = "https://github.com/LightDecision/lightdecision-1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
